<!doctype html>
<html lang="en" data-features="corners,lineart,view,markers">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d0f0e">
<title>Whiteboard Tracer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d0f0e'/%3E%3Cpath d='M7 22 L14 9 L19 17 L25 11' fill='none' stroke='%23ff5a3c' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
/* Layout: full-bleed camera, overlay placed by one homography, control bar at the bottom (right side in landscape). */
:root{
  --bg:#0d0f0e;
  --panel:rgba(16,18,17,.9);
  --line:rgba(255,255,255,.12);
  --fg:#f2f4f1;
  --muted:#9aa39d;
  --chip:#252a27;
  --chip-on:#3a403c;
  --accent:#ff5a3c;
  --ok:#3ddc84;
  --warn:#ffcc4d;
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:15px/1.4 var(--ui);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button,label.btn,a.btn{text-decoration:none;font:600 14px/1 var(--ui);color:var(--fg);background:var(--chip);border:1px solid var(--line);
  border-radius:10px;min-height:44px;padding:0 10px;display:flex;align-items:center;justify-content:center;gap:6px;
  touch-action:manipulation;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,label.btn:focus-within,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:active:not(:disabled),label.btn:active,a.btn:active{background:var(--chip-on)}
button[aria-pressed="true"],button[aria-expanded="true"]{border-color:var(--fg);background:var(--chip-on)}
input[type=number]{font:500 15px/1 var(--ui);color:var(--fg);background:var(--chip);border:1px solid var(--line);border-radius:10px;
  min-height:44px;width:84px;padding:0 10px;font-variant-numeric:tabular-nums}

#stage{position:fixed;inset:0;touch-action:none;overflow:hidden;background:#000}
#cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#view{position:absolute;left:0;top:0}
#ov,#miss{position:absolute;left:0;top:0;max-width:none;transform-origin:0 0;pointer-events:none;will-change:transform,opacity}
#ov.peek,#miss.peek{visibility:hidden}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;flex-direction:column;gap:10px;
  padding:10px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));
  background:var(--panel);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-width:58px}
.note{font-size:13px;color:var(--muted);flex:1;min-width:0}
input[type=range]{flex:1;min-width:0;accent-color:var(--accent);height:32px}
.val{font-variant-numeric:tabular-nums;width:44px;text-align:right;color:var(--muted)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px;flex:1;min-width:0}
.seg button{font-weight:500;padding:0 6px;min-width:0}
.dot{width:12px;height:12px;border-radius:50%;flex:none;border:1px solid rgba(255,255,255,.35)}
.panel{display:flex;flex-direction:column;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:6px}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.tabs button,.tabs label.btn{font-size:12.5px;padding:0 4px}
#t-lock{background:var(--accent);border-color:var(--accent);color:#1a0d09}
#file{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.pill{font-size:12px;font-weight:600;border-radius:999px;padding:4px 10px;background:var(--chip);color:var(--muted);white-space:nowrap}
.pill.ok{color:#0b2414;background:var(--ok)}
.pill.warn{color:#2a2104;background:var(--warn)}

.mini{position:fixed;z-index:6;display:none;gap:8px;
  right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.mini button{background:var(--panel);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding:0 16px}
body.locked .bar{display:none}
body.locked .mini{display:flex}

#toast{position:fixed;z-index:7;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);
  max-width:calc(100% - 32px);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;
  font-size:14px;text-align:center;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  opacity:0;transition:opacity .25s;pointer-events:none}
#toast.on{opacity:1}

#start{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:var(--bg);
  padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
#start .card{max-width:360px;display:flex;flex-direction:column;gap:16px}
#start h1{margin:0;font-size:28px;line-height:1.15;letter-spacing:-.01em;text-wrap:balance}
#start p{margin:0;color:var(--muted)}
#start img{width:100%;border-radius:12px;background:#fff;padding:10px}
#go{min-height:52px;font-size:16px;background:var(--accent);border-color:var(--accent);color:#1a0d09}
#err{color:#ffb4a3}

/* corner warp */
#handles{position:fixed;inset:0;z-index:6;pointer-events:none}
#quad{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#quad polygon{fill:none;stroke:#fff;stroke-width:1.5;stroke-dasharray:6 5;filter:drop-shadow(0 0 1px #000)}
.hdl{position:absolute;left:0;top:0;width:44px;height:44px;min-height:0;padding:0;border-radius:50%;border:2px solid #fff;
  background:rgba(255,90,60,.28);pointer-events:auto;touch-action:none;box-shadow:0 0 0 1px rgba(0,0,0,.55)}
.hdl::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:#fff}
.hdl.bad{border-color:var(--warn);background:rgba(255,204,77,.35)}
#corner-bar{position:absolute;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));
  width:min(560px,calc(100% - 24px));display:flex;align-items:center;gap:12px;padding:8px 8px 8px 14px;border-radius:14px;
  background:var(--panel);border:1px solid var(--line);pointer-events:none;font-size:14px}
#corner-bar span{flex:1;min-width:0}
#corners-done{background:var(--accent);border-color:var(--accent);color:#1a0d09;padding:0 18px;pointer-events:auto}
body.cornering .bar,body.cornering #toast{display:none}

/* camera view: glare badge */
#glare-badge{position:fixed;z-index:7;left:calc(12px + env(safe-area-inset-left,0px));top:calc(12px + env(safe-area-inset-top,0px));
  font-size:13px;font-weight:600;border-radius:999px;padding:6px 12px;background:var(--warn);color:#2a2104;pointer-events:none}

@media (orientation:landscape) and (max-height:520px){
  .bar{left:auto;top:0;width:300px;justify-content:flex-end;border-top:0;border-left:1px solid var(--line);overflow-y:auto;
    padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) 12px}
  .tabs{grid-auto-flow:row;grid-template-columns:repeat(4,1fr)}
  .row > .seg{flex-basis:100%}
}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>

<div id="stage">
  <video id="cam" playsinline muted autoplay></video>
  <img id="ov" alt="">
</div>

<div class="bar" id="bar">
  <div class="row">
    <span class="lbl">Opacity</span>
    <input id="op" type="range" min="10" max="100" step="1" value="70" aria-label="Overlay opacity">
    <span id="opv" class="val">70%</span>
  </div>

  <section class="panel" id="p-style" hidden aria-label="Style">
    <div class="row">
      <span class="lbl">Style</span>
      <div class="seg" id="style-seg">
        <button data-s="lines" aria-pressed="true">Lines</button>
        <button data-s="photo" aria-pressed="false">Photo</button>
      </div>
    </div>
    <div class="row" id="color-row">
      <span class="lbl">Color</span>
      <div class="seg" id="color-seg">
        <button data-c="red" aria-pressed="true"><span class="dot" style="background:#ff3b30"></span>Red</button>
        <button data-c="blue" aria-pressed="false"><span class="dot" style="background:#1e6bff"></span>Blue</button>
        <button data-c="green" aria-pressed="false"><span class="dot" style="background:#16c60c"></span>Green</button>
      </div>
    </div>
  </section>

  <section class="panel" id="p-align" hidden aria-label="Align">
    <div class="btns" id="align-btns">
      <button id="fit">Reset</button>
      <button id="rot">Turn 90°</button>
    </div>
  </section>

  <nav class="tabs" id="tabs">
    <label class="btn" for="file" id="t-image">Image<input id="file" type="file" accept="image/*"></label>
    <button id="t-style" data-panel="p-style" aria-expanded="false">Style</button>
    <button id="t-align" data-panel="p-align" aria-expanded="false">Align</button>
    <button id="t-peek">Peek</button>
    <button id="t-lock">Lock</button>
  </nav>
</div>

<div class="mini" id="mini">
  <button id="peek2">Hold to peek</button>
  <button id="unlock">Unlock</button>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<div id="start">
  <div class="card">
    <h1>Whiteboard Tracer</h1>
    <p>Shows your drawing on top of the live camera so you can trace it onto a whiteboard or paper.</p>
    <img id="thumb" alt="Drawing to trace">
    <button id="go">Start camera</button>
    <p id="err" hidden></p>
    <p>Set the phone on a tripod and turn on rotation lock before you align.</p>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
