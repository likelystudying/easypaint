<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d0f0e">
<title>Whiteboard Tracer</title>
<style>
/* Layout: full-bleed camera, image overlay on top, control bar at the bottom (right side in landscape). */
:root{
  --bg:#0d0f0e;
  --panel:rgba(16,18,17,.88);
  --line:rgba(255,255,255,.12);
  --fg:#f2f4f1;
  --muted:#9aa39d;
  --chip:#252a27;
  --accent:#ff5a3c;
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:15px/1.4 var(--ui);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button,label.btn{font:600 14px/1 var(--ui);color:var(--fg);background:var(--chip);border:1px solid var(--line);
  border-radius:10px;min-height:44px;padding:0 10px;display:flex;align-items:center;justify-content:center;
  touch-action:manipulation;cursor:pointer}
button:focus-visible,label.btn:focus-within,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:active,label.btn:active{background:#343a36}

#stage{position:fixed;inset:0;touch-action:none;overflow:hidden;background:#000}
#cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#ov{position:absolute;left:50%;top:50%;max-width:none;transform-origin:50% 50%;pointer-events:none;will-change:transform,opacity}
#ov.peek{visibility:hidden}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;flex-direction:column;gap:10px;
  padding:10px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));
  background:var(--panel);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:10px}
.lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-width:58px}
#op{flex:1;min-width:0;accent-color:var(--accent);height:32px}
#opv{font-variant-numeric:tabular-nums;width:44px;text-align:right;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;flex:1}
.seg button{gap:7px;font-weight:500}
.seg button[aria-pressed="true"]{border-color:var(--fg);background:#3a403c}
.dot{width:12px;height:12px;border-radius:50%;flex:none;border:1px solid rgba(255,255,255,.35)}
.tools{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tools button,.tools label.btn{font-size:13px;padding:0 4px}
#peek{background:#2f3531}
#lock{background:var(--accent);border-color:var(--accent);color:#1a0d09}
#file{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

.mini{position:fixed;z-index:6;display:none;gap:8px;
  right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.mini button{background:var(--panel);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding:0 16px}
body.locked .bar{display:none}
body.locked .mini{display:flex}

#toast{position:fixed;z-index:7;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);
  max-width:calc(100% - 32px);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;
  font-size:14px;text-align:center;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  opacity:0;transition:opacity .25s;pointer-events:none}
#toast.on{opacity:1}

#start{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:var(--bg);
  padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
#start .card{max-width:360px;display:flex;flex-direction:column;gap:16px}
#start h1{margin:0;font-size:28px;line-height:1.15;letter-spacing:-.01em;text-wrap:balance}
#start p{margin:0;color:var(--muted)}
#start img{width:100%;border-radius:12px;background:#fff;padding:10px}
#go{min-height:52px;font-size:16px;background:var(--accent);border-color:var(--accent);color:#1a0d09}
#err{color:#ffb4a3;display:none}
#err.on{display:block}

@media (orientation:landscape) and (max-height:520px){
  .bar{left:auto;top:0;width:260px;justify-content:flex-end;border-top:0;border-left:1px solid var(--line);
    padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) 12px}
  .row{flex-wrap:wrap}
  .seg{grid-template-columns:repeat(2,1fr)}
  .tools{grid-template-columns:repeat(3,1fr)}
}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>

<div id="stage">
  <video id="cam" playsinline muted autoplay></video>
  <img id="ov" alt="">
</div>

<div class="bar" id="bar">
  <div class="row">
    <span class="lbl">Opacity</span>
    <input id="op" type="range" min="10" max="100" step="1" value="70" aria-label="Overlay opacity">
    <span id="opv">70%</span>
  </div>
  <div class="row">
    <span class="lbl">Lines</span>
    <div class="seg" id="seg">
      <button data-c="red" aria-pressed="true"><span class="dot" style="background:#ff3b30"></span>Red</button>
      <button data-c="blue" aria-pressed="false"><span class="dot" style="background:#1e6bff"></span>Blue</button>
      <button data-c="green" aria-pressed="false"><span class="dot" style="background:#16c60c"></span>Green</button>
      <button data-c="photo" aria-pressed="false">Photo</button>
    </div>
  </div>
  <div class="tools">
    <label class="btn" for="file">Image<input id="file" type="file" accept="image/*"></label>
    <button id="fit">Reset</button>
    <button id="rot">Turn 90°</button>
    <button id="peek">Peek</button>
    <button id="lock">Lock</button>
  </div>
</div>

<div class="mini" id="mini">
  <button id="peek2">Hold to peek</button>
  <button id="unlock">Unlock</button>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<div id="start">
  <div class="card">
    <h1>Whiteboard Tracer</h1>
    <p>Shows your drawing on top of the live camera so you can trace it onto a whiteboard or paper.</p>
    <img id="thumb" alt="Drawing to trace">
    <button id="go">Start camera</button>
    <p id="err"></p>
    <p>Set the phone on a tripod and turn on rotation lock before you align.</p>
  </div>
</div>

const KEY = "wbtracer.v1";
const COLORS = { red:[255,59,48], blue:[30,107,255], green:[22,198,12] };

const $ = s => document.querySelector(s);
const stage = $("#stage"), cam = $("#cam"), ov = $("#ov");
const st = { tx:0, ty:0, s:1, r:0, op:70, color:"red", locked:false };
let srcURL = DEFAULT_SRC, srcImg = null, ovURL = null, stream = null, started = false, lastLandscape = null;

/* ---------- storage (per-device convenience only) ---------- */
function loadState(){
  try{
    const j = JSON.parse(localStorage.getItem(KEY) || "null");
    if (j){ Object.assign(st, j.st || {}); if (j.img) srcURL = j.img; }
  }catch(e){}
}
let saveTimer;
function saveState(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    const img = srcURL === DEFAULT_SRC ? null : srcURL;
    try{ localStorage.setItem(KEY, JSON.stringify({ st, img })); }
    catch(e){ try{ localStorage.setItem(KEY, JSON.stringify({ st })); }catch(_){} }
  }, 300);
}

/* ---------- image handling ---------- */
function loadImg(url){
  return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
}
function processImage(){
  if (!srcImg) return;

  const g = c.getContext("2d");
  g.fillStyle = "#fff"; g.fillRect(0, 0, w, h); g.drawImage(srcImg, 0, 0, w, h);
  if (st.color !== "photo"){
    // Dark pixels become solid colored line, light pixels become transparent.
    const d = g.getImageData(0, 0, w, h), p = d.data, [R,G,B] = COLORS[st.color];
    for (let i = 0; i < p.length; i += 4){
      const L = 0.299*p[i] + 0.587*p[i+1] + 0.114*p[i+2];
      const a = Math.max(0, Math.min(1, (235 - L) / 175));
      p[i] = R; p[i+1] = G; p[i+2] = B; p[i+3] = Math.round(a * 255);
    }
    g.putImageData(d, 0, 0);
  }
  c.toBlob(b => {
    if (!b) return;
    if (ovURL) URL.revokeObjectURL(ovURL);
    ovURL = URL.createObjectURL(b); ov.src = ovURL;
  }, "image/png");
}
function fitBase(){
  if (!srcImg) return;
  const W = stage.clientWidth, H = stage.clientHeight;
  const ar = srcImg.naturalWidth / srcImg.naturalHeight;
  let w = W * 0.9, h = w / ar;
  if (h > H * 0.75){ h = H * 0.75; w = h * ar; }
  ov.style.width = w + "px"; ov.style.height = h + "px";
  ov.style.marginLeft = (-w/2) + "px"; ov.style.marginTop = (-h/2) + "px";
}
function snapDeg(r){ const n = Math.round(r/90)*90; return Math.abs(r - n) < 3 ? n : r; }
function apply(){
  ov.style.transform = `translate(${st.tx}px,${st.ty}px) rotate(${snapDeg(st.r)}deg) scale(${st.s})`;
  ov.style.opacity = st.op / 100;
}
async function setSource(url, reset){
  srcImg = await loadImg(url);
  srcURL = url;
  $("#thumb").src = url;
  if (reset){ st.tx = 0; st.ty = 0; st.s = 1; st.r = 0; }
  fitBase(); processImage(); apply();
}

/* ---------- toast ---------- */
let toastTimer;
function toast(msg, ms = 3200){
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("on"), ms);
}

/* ---------- gestures: 1 finger moves, 2 fingers scale + rotate ---------- */
const pts = new Map();
const two = () => [...pts.values()].slice(0, 2).map(p => ({ x:p.x, y:p.y }));
stage.addEventListener("pointerdown", e => {
  if (!started || st.locked) return;
  stage.setPointerCapture(e.pointerId);
  pts.set(e.pointerId, { x:e.clientX, y:e.clientY });
});
stage.addEventListener("pointermove", e => {
  if (!pts.has(e.pointerId)) return;
  const before = two();
  pts.set(e.pointerId, { x:e.clientX, y:e.clientY });
  const after = two();
  if (pts.size === 1){
    st.tx += after[0].x - before[0].x; st.ty += after[0].y - before[0].y;
  } else {
    const [a0, b0] = before, [a1, b1] = after;
    const d0 = Math.hypot(b0.x - a0.x, b0.y - a0.y), d1 = Math.hypot(b1.x - a1.x, b1.y - a1.y);
    if (d0 < 8) return;
    let k = d1 / d0;
    const ns = Math.max(0.05, Math.min(20, st.s * k)); k = ns / st.s;
    const da = Math.atan2(b1.y - a1.y, b1.x - a1.x) - Math.atan2(b0.y - a0.y, b0.x - a0.x);
    const m0 = { x:(a0.x+b0.x)/2, y:(a0.y+b0.y)/2 }, m1 = { x:(a1.x+b1.x)/2, y:(a1.y+b1.y)/2 };
    const W = stage.clientWidth, H = stage.clientHeight;
    const vx = W/2 + st.tx - m0.x, vy = H/2 + st.ty - m0.y, c = Math.cos(da), s = Math.sin(da);
    st.tx = m1.x + k*(c*vx - s*vy) - W/2;
    st.ty = m1.y + k*(s*vx + c*vy) - H/2;
    st.s = ns; st.r += da * 180 / Math.PI;
  }
  apply();
});
function endPt(e){ if (pts.delete(e.pointerId)) saveState(); }
stage.addEventListener("pointerup", endPt);
stage.addEventListener("pointercancel", endPt);
["gesturestart","gesturechange","gestureend"].forEach(t => document.addEventListener(t, e => e.preventDefault()));

/* ---------- controls ---------- */
function syncUI(){
  $("#op").value = st.op; $("#opv").textContent = st.op + "%";
  document.querySelectorAll("#seg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.c === st.color)));
  document.body.classList.toggle("locked", st.locked);
}
$("#op").addEventListener("input", e => { st.op = +e.target.value; $("#opv").textContent = st.op + "%"; apply(); saveState(); });
$("#seg").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  st.color = b.dataset.c; syncUI(); processImage(); saveState();
});
$("#file").addEventListener("change", async e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  try{
    const raw = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(f); });
    const img = await loadImg(raw);
    // Downscale so it fits in browser storage and survives a reload.
    const k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas");
    c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
    let url = c.toDataURL("image/png");
    if (url.length > 1500000) url = c.toDataURL("image/jpeg", 0.9);
    await setSource(url, true); saveState(); toast("Image loaded. Drag and pinch to align.");
  }catch(err){ toast("That file could not be opened as an image. Try a PNG or JPEG."); }
  e.target.value = "";
});
$("#fit").addEventListener("click", () => { st.tx = 0; st.ty = 0; st.s = 1; st.r = 0; apply(); saveState(); });
$("#rot").addEventListener("click", () => { st.r = ((Math.round(snapDeg(st.r)/90)*90 + 90) % 360); apply(); saveState(); });
$("#lock").addEventListener("click", () => { st.locked = true; pts.clear(); syncUI(); saveState(); toast("Locked. Touches no longer move the image."); });
$("#unlock").addEventListener("click", () => { st.locked = false; syncUI(); saveState(); });
function bindPeek(btn){
  const on = e => { e.preventDefault(); ov.classList.add("peek"); };
  const off = () => ov.classList.remove("peek");
  btn.addEventListener("pointerdown", on);
  ["pointerup","pointercancel","pointerleave"].forEach(t => btn.addEventListener(t, off));
  btn.addEventListener("contextmenu", e => e.preventDefault());
}
bindPeek($("#peek")); bindPeek($("#peek2"));

/* ---------- camera ---------- */
async function startCam(){
  if (!window.isSecureContext) throw { name:"Insecure" };
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw { name:"Unsupported" };
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = await navigator.mediaDevices.getUserMedia({
    audio:false,
    video:{ facingMode:{ ideal:"environment" }, width:{ ideal:1920 }, height:{ ideal:1080 } }
  });
  cam.srcObject = stream;
  cam.play().catch(() => {});
}
function camError(e){
  const m = {
    Insecure: "The camera only works when this page is opened from an https:// address. Host the file (for example on GitHub Pages) and open that link.",
    Unsupported: "This browser cannot access the camera. Update iOS, or try Safari.",
    NotAllowedError: "Camera access was blocked. In iOS Settings, open Chrome (or Safari) and allow Camera, then reload this page and tap Start again.",
    NotFoundError: "No camera was found on this device.",
    NotReadableError: "The camera is busy in another app. Close it and try again."
  };
  return m[e && e.name] || ("The camera could not start (" + ((e && e.name) || "unknown error") + "). Reload and try again.");
}
let wake = null;
async function keepAwake(){
  try{ if ("wakeLock" in navigator && document.visibilityState === "visible") wake = await navigator.wakeLock.request("screen"); }catch(e){}
}
document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState !== "visible" || !started) return;
  const t = stream && stream.getVideoTracks()[0];
  if (!t || t.readyState === "ended"){ try{ await startCam(); }catch(e){ toast(camError(e), 6000); } }
  else cam.play().catch(() => {});
  keepAwake();
});
$("#go").addEventListener("click", async () => {
  const err = $("#err"); err.classList.remove("on");
  try{
    await startCam();
    started = true; $("#start").hidden = true;
    fitBase(); apply(); keepAwake();
    lastLandscape = stage.clientWidth > stage.clientHeight;
    toast(st.locked ? "Restored your last alignment. Tap Unlock to adjust." : "Drag to move. Pinch to resize and rotate. Tap Lock when it lines up.", 4500);
  }catch(e){ err.textContent = camError(e); err.classList.add("on"); }
});
window.addEventListener("resize", () => {
  fitBase(); apply();
  const land = stage.clientWidth > stage.clientHeight;
  if (started && lastLandscape !== null && land !== lastLandscape) toast("Screen rotated, so the alignment shifted. Turn on rotation lock and re-align.", 5000);
  lastLandscape = land;
});

/* ---------- boot ---------- */
loadState(); syncUI();
setSource(srcURL, false).catch(() => setSource(DEFAULT_SRC, true));
</script>
</body>
</html>
